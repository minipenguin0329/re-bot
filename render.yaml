services:
  - type: web
    name: rebot-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ENVIRONMENT
        value: production
      - key: MAX_IMAGE_SIZE_MB
        value: 5
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: rebot-frontend
    runtime: static
    rootDir: frontend/rebot-app
    buildCommand: corepack enable && pnpm install --frozen-lockfile && npx expo export --platform web
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://rebot-backend.onrender.com
      - key: EXPO_PUBLIC_SUPABASE_URL
        value: https://jdhassvacgsgkisvtcxi.supabase.co
      - key: EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_HGYc1tEOdKw1KmJS5UaHdQ_v79Dd-VY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
