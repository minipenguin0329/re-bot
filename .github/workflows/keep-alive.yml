name: Keep backend alive

on:
  schedule:
    # Render's free tier spins down after ~15 minutes of inactivity, so ping
    # well within that window to keep it warm (e.g. for hackathon judging).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://rebot-backend.onrender.com/health)
          echo "Health check status: $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Backend health check returned $status"
          fi
